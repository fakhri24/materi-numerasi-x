<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persentase - Numerasi X</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f0f1a;color:#e0e0e0;line-height:1.7;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:2rem;background:linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{text-align:center;color:#888;margin-bottom:30px;font-size:.95rem}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600;margin-bottom:16px}
.badge.prasyarat{background:#16213e;color:#60a5fa;border:1px solid #2a3a5e}
.badge.sistem{background:#2a1e3e;color:#a78bfa;border:1px solid #3a2a5e}
.badge-wrap{text-align:center}
.card{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:14px;padding:32px;margin-bottom:20px;text-align:center}
.card h2{color:#60a5fa;margin-bottom:12px;font-size:1.3rem}
.card p{color:#aaa}
.back-link{display:inline-block;color:#888;text-decoration:none;font-size:.9rem;margin-bottom:16px;transition:color .2s}
.back-link:hover{color:#60a5fa}
.emoji-big{font-size:3rem;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">
<a href="../index.html" class="back-link">← Kembali ke Daftar Materi</a>
<h1>💯 Persentase</h1>
<div class="badge-wrap"><span class="badge prasyarat">Prasyarat</span></div>
<div class="card">
<div class="emoji-big">🚧</div>
<h2>Segera Hadir</h2>
<p>Materi interaktif untuk topik ini sedang disiapkan. Nantikan penjelasan, contoh, dan latihan interaktifnya di sini!</p>
</div>
</div>
</body>
</html>
